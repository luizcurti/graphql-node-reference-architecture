apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: graphql-node
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 2Gi
---
# Runs once, only when the pod's data directory is empty (standard mysql
# image behavior for /docker-entrypoint-initdb.d) — creates the account
# mysql-replica.yaml's replica uses to stream the binlog. Replicated
# read-only workloads only need REPLICATION SLAVE, never data access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-primary-init
  namespace: graphql-node
data:
  # No `set -euo pipefail` here: the mysql image's docker-entrypoint.sh
  # sources this file (". \"$f\"") into its own shell process rather than
  # executing it as a subprocess — `set -u` leaking into that parent script
  # crashed it on the next optional/unset variable it reads afterward
  # (verified directly: MYSQL_ONETIME_PASSWORD, causing a restart loop).
  01-create-repl-user.sh: |
    #!/bin/bash
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<-EOSQL
      CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_REPL_PASSWORD}';
      GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';
      FLUSH PRIVILEGES;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: graphql-node
spec:
  replicas: 1
  strategy:
    # A single ReadWriteOnce PVC can't be mounted by two pods at once — a
    # rolling update would leave the new pod stuck Pending. Recreate the one
    # pod instead (brief downtime on redeploy, acceptable for this demo DB).
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            # Replication: GTID-based, so mysql-replica.yaml can use
            # SOURCE_AUTO_POSITION instead of tracking binlog file/offset by
            # hand. Read-only queries and DataLoader batch reads route here
            # to the replica instead — see src/knex/index.ts.
            - --server-id=1
            - --log-bin=mysql-bin
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
            - --binlog-format=ROW
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphql-node-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: graphql-node-config
                  key: DATABASE_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: graphql-node-secrets
                  key: DATABASE_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphql-node-secrets
                  key: DATABASE_PASSWORD
            - name: MYSQL_REPL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphql-node-secrets
                  key: MYSQL_REPL_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-primary-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ['sh', '-c', 'mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ['sh', '-c', 'mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: mysql-primary-init
          configMap:
            name: mysql-primary-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: graphql-node
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
