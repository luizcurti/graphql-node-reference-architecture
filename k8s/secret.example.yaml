# TEMPLATE — placeholder values only, safe to commit. Do not `kubectl apply`
# this file as-is in anything but a throwaway local cluster.
#
# For real use, generate the Secret imperatively instead of editing and
# committing this file (avoids ever putting real credentials in git history):
#
#   kubectl create secret generic graphql-node-secrets -n graphql-node \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_USER=graphql_user \
#     --from-literal=DATABASE_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MYSQL_ROOT_PASSWORD="$(openssl rand -base64 24)"
#
# (k8s/*.yaml.local and k8s/secret.yaml are gitignored, in case you do save a
# filled-in copy locally.)
apiVersion: v1
kind: Secret
metadata:
  name: graphql-node-secrets
  namespace: graphql-node
type: Opaque
stringData:
  JWT_SECRET: 'change-this-to-a-long-random-secret-min-32-chars'
  DATABASE_USER: 'graphql_user'
  DATABASE_PASSWORD: 'change-me'
  MYSQL_ROOT_PASSWORD: 'change-me'
  # Used only by mysql.yaml/mysql-replica.yaml's init scripts to set up
  # replication (CREATE USER 'repl'@'%' on the primary, CHANGE REPLICATION
  # SOURCE ... on the replica) — not used by the app itself.
  MYSQL_REPL_PASSWORD: 'change-me'
  # Optional — gates /metrics behind the X-Metrics-Token header. Omit this
  # key entirely to leave /metrics open (fine behind a network policy that
  # already restricts scrape access).
  # METRICS_TOKEN: 'change-this-to-a-long-random-secret'
