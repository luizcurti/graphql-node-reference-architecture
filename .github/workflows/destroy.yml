name: Destroy

# Manually tears down the AWS stack (infra/) to stop paying for it while
# unused (mainly RDS, ElastiCache, the ALB, the Fargate tasks and their public
# IPv4 addresses). Recreate it with the CI workflow's "Run workflow" button on
# main (or any push to main). The one-time bootstrap/ resources (state bucket,
# OIDC provider, deploy role) are kept.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete every AWS resource of this stack (MySQL, Redis and Kafka data and the pushed images included)'
        required: true
        type: string

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check confirmation
        working-directory: .
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error title=Not confirmed::Type exactly \"destroy\" to run this workflow."
            exit 1
          fi

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-destroy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init (S3 remote state)
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=graphql-node-reference-architecture/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # CloudFront is disabled and then deleted, and RDS and ElastiCache take a
      # while too: expect ~15 minutes.
      - name: Terraform destroy
        shell: bash # bash -eo pipefail, so `| tee` keeps Terraform's exit code
        run: terraform destroy -auto-approve -input=false -no-color 2>&1 | tee destroy.log

      - name: Report Terraform errors
        if: failure()
        run: |
          [ -f destroy.log ] || exit 0
          awk '{ gsub(/%/, "%25") }
               /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
               buf && n < 15 { buf = buf "%0A" $0; n++ }
               END { if (buf) print buf }' destroy.log |
            while IFS= read -r block; do echo "::error title=Terraform (destroy.log)::${block}"; done

      - name: Summary
        run: |
          echo "### Stack destroyed :wastebasket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Recreate it with **Actions → CI → Run workflow** on \`main\`." >> "$GITHUB_STEP_SUMMARY"
