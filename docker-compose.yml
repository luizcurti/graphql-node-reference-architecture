services:
  graphql_mysql:
    container_name: graphql_mysql
    hostname: graphql_mysql
    image: mysql:8.0
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      TZ: America/Sao_Paulo
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Not profile-gated like Jaeger/Prometheus/Grafana below: REDIS_URL is
  # required in production (see src/graphql/pubsub.ts) and backs subscriptions, the
  # distributed login rate limiter, and the JWT verification cache (see
  # src/graphql/context/token-cache.ts) — without this running, local dev
  # never actually exercises any of that, only its in-memory/DB-every-time
  # fallbacks. The app itself doesn't require it in development (NODE_ENV
  # only enforces REDIS_URL in production), so it's not a hard `depends_on`.
  redis:
    container_name: graphql_redis
    hostname: redis
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: graphql_app
    hostname: graphql_app
    restart: always
    depends_on:
      graphql_mysql:
        condition: service_healthy
    ports:
      - "${PORT:-4003}:4003"
    environment:
      DATABASE_HOST: graphql_mysql
      KAFKA_BROKERS: kafka:19092
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Kafka broker backing the comment.created event backbone (see
  # ../src/kafka). Not profile-gated: this is a reference architecture
  # meant to demonstrate the event-driven path in real use, not just have
  # it exist unused in the code. Set KAFKA_BROKERS=localhost:9092 (host) or
  # kafka:19092 (container-to-container) in .env for the app to use it; if
  # KAFKA_BROKERS is unset the app still degrades to direct PubSub
  # publishing, same as if this container weren't running at all.
  kafka:
    container_name: graphql_kafka
    hostname: kafka
    image: apache/kafka:3.9.0
    restart: always
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Optional Jaeger all-in-one, for the OpenTelemetry traces the app exports
  # when OTEL_EXPORTER_OTLP_ENDPOINT is set (see ../src/observability/tracing.ts).
  # Off by default; opt in with `docker compose --profile observability up -d`
  # and set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 (container-to-
  # container) or http://localhost:4318 (host) in .env. UI at :16686.
  jaeger:
    container_name: graphql_jaeger
    hostname: jaeger
    image: jaegertracing/all-in-one:1.60
    restart: always
    profiles: ["observability"]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

  # Scrapes the app's /metrics (see ../src/observability/metrics.ts) on the
  # same "observability" profile as Jaeger. Config in ./monitoring/prometheus.
  prometheus:
    container_name: graphql_prometheus
    hostname: prometheus
    image: prom/prometheus:v3.1.0
    restart: always
    profiles: ["observability"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  # Pre-provisioned with the Prometheus datasource above and a "GraphQL
  # Node — Overview" dashboard (HTTP/GraphQL/Kafka metrics, Node.js process
  # health) — see ./monitoring/grafana. Default login admin/admin (change on
  # first sign-in; irrelevant for a local/throwaway stack like this one).
  grafana:
    container_name: graphql_grafana
    hostname: grafana
    image: grafana/grafana:11.4.0
    restart: always
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  mysql_data:
