# Single-broker KRaft-mode Kafka (no ZooKeeper) backing the comment.created
# event backbone — see src/kafka. KAFKA_BROKERS in configmap.yaml points the
# app at this service. No PVC: a portfolio-scale broker losing its log on
# restart is an acceptable tradeoff for not needing StatefulSet+storage here;
# the app's consumer already tolerates a cold/just-restarted broker (see
# src/kafka/consumer.ts's subscribeWithRetry) and its producer degrades to
# direct PubSub publishing if it can't reach a broker at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: graphql-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: '1'
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # localhost, not the "kafka" Service name: broker and
            # controller are the same combined-mode process in this single-
            # replica setup, so self-registration never needs to leave the
            # pod. Routing it through the Service instead (matching the
            # Service name used by the client-facing listeners below) hit a
            # host mismatch against the pod's own auto-detected hostname
            # during controller registration and reliably crashed the
            # broker around 60s in — verified directly against a real kind
            # cluster.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:19093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: '1'
          # timeoutSeconds is explicit on both probes below: the default (1s)
          # isn't enough for this script to boot its own JVM and complete a
          # broker round-trip — verified directly against a real kind
          # cluster, where the 1s default made both probes fail on timeout
          # (not on the actual check) and crash-loop an otherwise-healthy
          # broker. livenessProbe's generous initialDelay/failureThreshold
          # is deliberate too: a combined broker+controller registering
          # itself through the Service (not localhost) takes noticeably
          # longer to settle on a resource-constrained single-node kind
          # cluster than on Docker Compose's flat network, and a liveness
          # kill mid-registration discards that progress — restarting the
          # whole thing from zero rather than just waiting a bit longer.
          # Verified directly: the previous tighter thresholds crash-looped
          # indefinitely; these let it converge and reach Ready.
          readinessProbe:
            exec:
              command:
                [
                  '/opt/kafka/bin/kafka-broker-api-versions.sh',
                  '--bootstrap-server',
                  'localhost:9092',
                ]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                [
                  '/opt/kafka/bin/kafka-broker-api-versions.sh',
                  '--bootstrap-server',
                  'localhost:9092',
                ]
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: graphql-node
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: internal
      port: 19092
      targetPort: 19092
    # KRaft controller RPCs (self-registration, quorum voter traffic) go
    # over this port to the same "kafka" Service name set in
    # KAFKA_CONTROLLER_QUORUM_VOTERS above. Missing it here (unlike Docker
    # Compose, where any container can reach any port another container
    # listens on) left the broker unable to complete controller
    # registration — verified directly against a real kind cluster, where
    # the broker crash-looped on "Unable to register the broker because the
    # RPC got timed out before it could be sent" until this port was added.
    - name: controller
      port: 19093
      targetPort: 19093
