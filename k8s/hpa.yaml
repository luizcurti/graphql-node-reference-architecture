# Requires metrics-server in the cluster (not present by default in kind —
# see k8s/README.md for the one-liner to add it). Without it this object is
# accepted by the API server but never actually scales anything.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphql-node
  namespace: graphql-node
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: graphql-node
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
